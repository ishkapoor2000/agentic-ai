[project]
name = "agentic-aish"
version = "1.0.2"
description = "AI-powered documentation generator for large codebases with interactive mindmap visualization."
authors = [
    {name = "Ish Kapoor", email = "ishkapoor2000@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["documentation", "ai", "llm", "codebase", "analysis", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "sqlmodel>=0.0.14",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pathspec>=0.11.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/ishkapoor2000/agentic-ai"
Documentation = "https://github.com/ishkapoor2000/agentic-ai#readme"
Repository = "https://github.com/ishkapoor2000/agentic-ai"

[project.scripts]
agentic-doc = "agentic_doc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_doc"]
