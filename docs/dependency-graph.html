<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Interactive Dependency Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e1e; /* Dark background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify_content: center;
            align-items: center;
            background-image: 
                linear-gradient(#333 1px, transparent 1px),
                linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 20px 20px;
        }
        #graph-div {
            width: 100%;
            height: 100%;
            opacity: 0; /* Hidden until rendered */
            transition: opacity 0.5s ease-in;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2d2d2d;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        .controls button {
            padding: 8px 12px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .controls button:hover {
            background: #0056b3;
        }
        /* Tooltip styling */
        .mermaidTooltip {
            background-color: #333 !important;
            color: #fff !important;
            border: 1px solid #555 !important;
        }
        
        /* Node styling overrides */
        .node rect, .node circle, .node polygon {
            fill: #2d2d2d !important;
            stroke: #555 !important;
        }
        .node .label {
            color: #e0e0e0 !important;
        }
        
        /* Loading indicator */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div id="loading">Rendering Graph...</div>
    <div id="container">
        <div id="graph-div"></div>
    </div>
    
    <div class="controls">
        <button onclick="zoomIn()">+</button>
        <button onclick="zoomOut()">-</button>
        <button onclick="resetZoom()">Reset</button>
        <button onclick="fitGraph()">Fit</button>
    </div>

    <script>
        // Graph Data
        const graphDefinition = `graph TD
    node_1[Config]
    node_2(load_config)
    node_3(save_config)
    node_4(init)
    node_5(scan)
    node_6(doc)
    node_7(graph)
    node_8(serve)
    node_9[LLMClient]
    node_10{LLMClient.__init__}
    node_11{LLMClient._hash_prompt}
    node_12{LLMClient.generate}
    node_13[ModelProvider]
    node_14{ModelProvider.generate}
    node_15[OpenAIProvider]
    node_16{OpenAIProvider.__init__}
    node_17{OpenAIProvider.generate}
    node_18[MockProvider]
    node_19{MockProvider.generate}
    node_20(get_provider)
    node_21[DocBuilder]
    node_22{DocBuilder.__init__}
    node_23{DocBuilder.generate_file_docs}
    node_24{DocBuilder._process_file}
    node_25{DocBuilder.generate_dir_docs}
    node_26{DocBuilder._process_directory}
    node_27{DocBuilder.generate_arch_doc}
    node_28[PythonAnalyzer]
    node_29{PythonAnalyzer.analyze}
    node_30[SymbolVisitor]
    node_31{SymbolVisitor.__init__}
    node_32{SymbolVisitor._get_docstring}
    node_33{SymbolVisitor.visit_ClassDef}
    node_34{SymbolVisitor.visit_FunctionDef}
    node_35{SymbolVisitor.visit_AsyncFunctionDef}
    node_36{SymbolVisitor._visit_function}
    node_37{SymbolVisitor.visit_Import}
    node_38{SymbolVisitor.visit_ImportFrom}
    node_39{SymbolVisitor.visit_Call}
    node_40{SymbolVisitor._get_func_name}
    node_41[JavaScriptAnalyzer]
    node_42{JavaScriptAnalyzer.analyze}
    node_43[ExtractedSymbol]
    node_44[ExtractedReference]
    node_45[AnalysisResult]
    node_46[BaseAnalyzer]
    node_47{BaseAnalyzer.analyze}
    node_48(create_db_and_tables)
    node_49(get_session)
    node_50[File]

    classDef important fill:#ff6b6b,stroke:#c92a2a,color:#fff
    classDef moderate fill:#69db7c,stroke:#37b24d,color:#000`;
        const nodePaths = {"1": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/config.py", "2": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/config.py", "3": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/config.py", "4": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/cli.py", "5": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/cli.py", "6": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/cli.py", "7": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/cli.py", "8": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/cli.py", "9": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/core.py", "10": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/core.py", "11": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/core.py", "12": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/core.py", "13": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/providers.py", "14": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/providers.py", "15": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/providers.py", "16": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/providers.py", "17": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/providers.py", "18": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/providers.py", "19": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/providers.py", "20": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/llm/providers.py", "21": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/core/doc_builder.py", "22": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/core/doc_builder.py", "23": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/core/doc_builder.py", "24": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/core/doc_builder.py", "25": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/core/doc_builder.py", "26": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/core/doc_builder.py", "27": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/core/doc_builder.py", "28": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "29": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "30": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "31": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "32": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "33": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "34": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "35": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "36": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "37": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "38": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "39": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "40": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/python.py", "41": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/javascript.py", "42": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/javascript.py", "43": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/base.py", "44": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/base.py", "45": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/base.py", "46": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/base.py", "47": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/analysis/base.py", "48": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/db/session.py", "49": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/db/session.py", "50": "/Users/ishkapoor/Desktop/Divya Drishti/agentic_doc/db/schema.py"};

        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            theme: 'dark',
            flowchart: {
                useMaxWidth: false,
                htmlLabels: true,
                curve: 'basis'
            }
        });

        var panZoom = null;

        async function renderGraph() {
            try {
                const element = document.querySelector('#graph-div');
                const { svg } = await mermaid.render('mermaid-svg', graphDefinition);
                element.innerHTML = svg;
                
                // Setup interactions
                setupInteractions();
                
                // Initialize PanZoom
                initPanZoom();
                
                // Show graph, hide loading
                element.style.opacity = 1;
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                console.error('Mermaid rendering failed:', error);
                document.getElementById('loading').innerText = 'Rendering Failed: ' + error.message;
            }
        }

        function setupInteractions() {
            // Add click handlers to nodes
            const nodes = document.querySelectorAll('.node');
            nodes.forEach(node => {
                // Extract ID from mermaid node id (e.g., "flowchart-node_123-...")
                const idMatch = node.id.match(/node_(\d+)/);
                if (idMatch) {
                    const nodeId = parseInt(idMatch[1]);
                    const path = nodePaths[nodeId];
                    
                    if (path) {
                        node.style.cursor = 'pointer';
                        node.onclick = () => {
                            console.log("Opening:", path);
                            window.location.href = "vscode://file/" + path;
                        };
                        
                        // Add hover effect
                        node.onmouseover = () => {
                            node.querySelector('rect, circle, polygon').style.stroke = '#007bff';
                            node.querySelector('rect, circle, polygon').style.strokeWidth = '3px';
                        };
                        node.onmouseout = () => {
                            node.querySelector('rect, circle, polygon').style.stroke = '#555';
                            node.querySelector('rect, circle, polygon').style.strokeWidth = '1px';
                        };
                    }
                }
            });
        }

        function initPanZoom() {
            const svg = document.querySelector('#graph-div svg');
            if (!svg) return;

            // Make SVG responsive
            svg.style.width = '100%';
            svg.style.height = '100%';
            svg.style.maxWidth = 'none';

            panZoom = svgPanZoom(svg, {
                zoomEnabled: true,
                controlIconsEnabled: false,
                fit: true,
                center: true,
                minZoom: 0.1,
                maxZoom: 20,
                dblClickZoomEnabled: true,
                mouseWheelZoomEnabled: true
            });
        }

        // Control functions
        function zoomIn() { if(panZoom) panZoom.zoomIn(); }
        function zoomOut() { if(panZoom) panZoom.zoomOut(); }
        function resetZoom() { if(panZoom) panZoom.resetZoom(); }
        function fitGraph() { 
            if(panZoom) {
                panZoom.fit();
                panZoom.center();
            }
        }

        // Start rendering
        renderGraph();
    </script>
</body>
</html>
